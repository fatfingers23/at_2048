[package]
name = "backend_shared"
version = "0.1.0"
edition = "2024"

[dependencies]
atrium-api.workspace = true
atrium-xrpc-client.workspace = true
atrium-common.workspace = true
atrium-repo.workspace = true
atrium-crypto.workspace = true
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-native-tls", "postgres", "derive", "macros", "migrate", "json"] }
thiserror = "2.0.12"
types-2048.workspace = true
serde_json = "1.0"
serde_bytes = "0.11.9"
twothousand-forty-eight = "0.22.1"
redis = { version = "0.32.0", features = ["tokio-comp", "connection-manager"] }
log.workspace = true
serde.workspace = true
ipld-core = "0.4.1"
serde_ipld_dagcbor = { version = "0.6.0", default-features = false, features = ["std"] }